# ---------------------------------------------------------------------------
# Limites de recursos (benchmark)
#
# Os limites vêm de variáveis, com perfil "medium" como padrão. Para trocar de perfil
# sem editar este arquivo:
#   docker compose --env-file .env --env-file limits/small.env up -d --build
#   docker compose --env-file .env --env-file limits/medium.env up -d --build
#   docker compose --env-file .env --env-file limits/large.env up -d --build
#
# O orçamento TOTAL da camada de dados é igual ao da branch multimodel-approach
# (ArangoDB = Mongo + Neo4j), e a API tem o mesmo limite nas duas abordagens.
# `memswap_limit` igual a `mem_limit` desabilita swap, que mascararia falta de memória.
# ---------------------------------------------------------------------------
services:
  api:
    image: ebenezer-backend
    container_name: ebenezer-api
    cpus: ${API_CPUS:-4}
    mem_limit: ${API_MEM:-4g}
    memswap_limit: ${API_MEM:-4g}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGODB_CONNECTION_STRING=mongodb://${MONGODB_ROOT_USER}:${MONGODB_ROOT_PASSWORD}@mongodb:27017
      - NEO4J_URI=bolt://neo4j:7687

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ebenezer-mongo-express
    ports:
      - "${MONGODB_EXPRESS_PORT}:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGODB_ROOT_USER}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGODB_ROOT_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_ROOT_PASSWORD}
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure

  mongodb:
    image: mongo:8.0
    container_name: ebenezer-mongodb
    cpus: ${MONGODB_CPUS:-2}
    mem_limit: ${MONGODB_MEM:-3g}
    memswap_limit: ${MONGODB_MEM:-3g}
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE_NAME}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j:
    image: neo4j:5.26-community
    container_name: ebenezer-neo4j
    cpus: ${NEO4J_CPUS:-2}
    mem_limit: ${NEO4J_MEM:-5g}
    memswap_limit: ${NEO4J_MEM:-5g}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      # Heap + page cache fixos e menores que o limite do contêiner (o restante é
      # sobrecarga da JVM e do sistema). Heap inicial = máximo evita redimensionamento.
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP:-2g}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP:-2g}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-2g}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
